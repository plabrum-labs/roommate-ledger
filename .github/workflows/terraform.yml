name: Terraform

# Plan on PRs (posted as a comment), apply on push to main. Only for changes under infra/.
on:
  push:
    branches: [main]
    paths: ['infra/**', '.github/workflows/terraform.yml']
  pull_request:
    paths: ['infra/**', '.github/workflows/terraform.yml']

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write # comment the plan on PRs

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra
    env:
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      # The state backend is R2's S3 API (infra/backend.hcl). R2 S3 credentials derive from any Cloudflare API token
      # with R2 permission: access key id = the token's id, secret = sha256(token value). The token must include
      # Account > Workers R2 Storage > Edit, or init fails below.
      - name: Derive R2 state credentials from the Cloudflare token
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: 42ea0d21baf84d2a10e66a9ff0a421cc
        working-directory: .
        run: |
          set -euo pipefail
          verify() { curl -fsS -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/$1/tokens/verify"; }
          # User-owned tokens verify at /user; account-owned tokens at /accounts/<id>.
          id=$( (verify user || verify "accounts/$CF_ACCOUNT_ID") | jq -r '.result.id')
          if [ -z "$id" ] || [ "$id" = null ]; then echo "Could not resolve the Cloudflare token id" >&2; exit 1; fi
          secret=$(printf %s "$CF_TOKEN" | sha256sum | cut -d' ' -f1)
          echo "::add-mask::$id"
          echo "::add-mask::$secret"
          echo "AWS_ACCESS_KEY_ID=$id" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$secret" >> "$GITHUB_ENV"

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false -reconfigure -backend-config=backend.hcl

      - name: Validate
        run: terraform validate

      - name: Plan
        run: |
          terraform plan -input=false -no-color -out=tfplan
          terraform show -no-color tfplan > plan_output.txt

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('./infra/plan_output.txt', 'utf8');
            const max = 60000;
            const body = plan.length > max ? plan.slice(0, max) + '\n\n... (truncated)' : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan\n<details><summary>Show plan</summary>\n\n\`\`\`hcl\n${body}\n\`\`\`\n</details>`,
            });

      - name: Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -input=false -auto-approve tfplan
